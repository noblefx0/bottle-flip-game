<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Bottle Flip</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    color: white;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

/* UI */

#ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 10;
}

.scoreboard {
    position: absolute;
    top: 22px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 50px;
    text-align: center;
}

.player {
    min-width: 100px;
}

.player-name {
    font-size: 13px;
    opacity: .65;
    letter-spacing: 1px;
}

.score {
    margin-top: 4px;
    font-size: 32px;
    font-weight: bold;
}

#turn {
    position: absolute;
    top: 105px;
    left: 50%;
    transform: translateX(-50%);
    padding: 9px 18px;
    border-radius: 20px;
    background: rgba(0,0,0,.55);
    font-size: 13px;
    white-space: nowrap;
}

#message {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    font-size: 15px;
    opacity: .85;
    white-space: nowrap;
}

#power {
    position: absolute;
    bottom: 75px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 6px;
    border-radius: 10px;
    background: rgba(255,255,255,.18);
    overflow: hidden;
    opacity: 0;
}

#powerBar {
    width: 0%;
    height: 100%;
    background: white;
}

#restart {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    border: 0;
    border-radius: 30px;
    padding: 13px 25px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    display: none;
    pointer-events: auto;
}
</style>
</head>

<body>

<div id="game"></div>

<div id="ui">

    <div class="scoreboard">

        <div class="player">
            <div class="player-name">PLAYER 1</div>
            <div class="score" id="score1">0</div>
        </div>

        <div class="player">
            <div class="player-name">PLAYER 2</div>
            <div class="score" id="score2">0</div>
        </div>

    </div>

    <div id="turn">PLAYER 1'S TURN</div>

    <div id="power">
        <div id="powerBar"></div>
    </div>

    <div id="message">
        Swipe upward on your bottle
    </div>

    <button id="restart">
        PLAY AGAIN
    </button>

</div>


<!-- THREE.JS -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
}
</script>


<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import RAPIER from
    "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/+esm";


/* =========================================================
   BASIC SETUP
========================================================= */

const game = document.getElementById("game");

const score1El = document.getElementById("score1");
const score2El = document.getElementById("score2");

const turnEl = document.getElementById("turn");
const messageEl = document.getElementById("message");

const powerEl = document.getElementById("power");
const powerBarEl = document.getElementById("powerBar");

const restartBtn = document.getElementById("restart");


/* =========================================================
   THREE.JS
========================================================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x171717);

scene.fog = new THREE.Fog(
    0x171717,
    7,
    18
);


const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(
    0,
    5.4,
    8.5
);


const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

game.appendChild(renderer.domElement);


/* =========================================================
   CAMERA CONTROLS
========================================================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.enablePan = false;

controls.minDistance = 6;

controls.maxDistance = 12;

controls.minPolarAngle = 0.65;

controls.maxPolarAngle = 1.35;


/* =========================================================
   LIGHTING
========================================================= */

const ambientLight =
    new THREE.HemisphereLight(
        0xffffff,
        0x333333,
        2
    );

scene.add(ambientLight);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

keyLight.position.set(
    4,
    8,
    5
);

keyLight.castShadow = true;

keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;

keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;

scene.add(keyLight);


/* =========================================================
   TABLE
========================================================= */

const tableWidth = 7.5;
const tableDepth = 4.5;
const tableHeight = 0.5;


const tableGeometry =
    new THREE.BoxGeometry(
        tableWidth,
        tableHeight,
        tableDepth
    );


const tableMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x70451f,
        roughness: 0.55,
        metalness: 0.05
    });


const table =
    new THREE.Mesh(
        tableGeometry,
        tableMaterial
    );

table.position.y =
    -tableHeight / 2;

table.receiveShadow = true;

table.castShadow = true;

scene.add(table);


/* =========================================================
   TABLE TOP LINE
========================================================= */

const centerLineGeometry =
    new THREE.BoxGeometry(
        0.025,
        0.012,
        tableDepth - 0.3
    );

const centerLineMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.18
    });

const centerLine =
    new THREE.Mesh(
        centerLineGeometry,
        centerLineMaterial
    );

centerLine.position.y =
    0.256;

scene.add(centerLine);


/* =========================================================
   BOTTLE CREATION
========================================================= */

function createBottle() {

    const group =
        new THREE.Group();


    /*
        Main bottle body
    */

    const bodyGeometry =
        new THREE.CylinderGeometry(
            0.42,
            0.47,
            1.75,
            32
        );


    const bodyMaterial =
        new THREE.MeshPhysicalMaterial({
            color: 0xf2f7fa,
            transparent: true,
            opacity: 0.68,
            roughness: 0.12,
            metalness: 0,
            transmission: 0.25,
            thickness: 0.2
        });


    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    body.castShadow = true;
    body.receiveShadow = true;

    group.add(body);


    /*
        Shoulder
    */

    const shoulderGeometry =
        new THREE.SphereGeometry(
            0.43,
            32,
            16,
            0,
            Math.PI * 2,
            0,
            Math.PI / 2
        );


    const shoulder =
        new THREE.Mesh(
            shoulderGeometry,
            bodyMaterial
        );

    shoulder.scale.y = 0.65;

    shoulder.position.y =
        0.85;

    shoulder.castShadow = true;

    group.add(shoulder);


    /*
        Neck
    */

    const neckGeometry =
        new THREE.CylinderGeometry(
            0.19,
            0.22,
            0.45,
            24
        );


    const neck =
        new THREE.Mesh(
            neckGeometry,
            bodyMaterial
        );

    neck.position.y =
        1.15;

    neck.castShadow = true;

    group.add(neck);


    /*
        Cap
    */

    const capGeometry =
        new THREE.CylinderGeometry(
            0.21,
            0.21,
            0.18,
            24
        );


    const capMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xeeeeee,
            roughness: 0.45
        });


    const cap =
        new THREE.Mesh(
            capGeometry,
            capMaterial
        );

    cap.position.y =
        1.47;

    cap.castShadow = true;

    group.add(cap);


    /*
        Bottle label
    */

    const labelGeometry =
        new THREE.CylinderGeometry(
            0.425,
            0.425,
            0.48,
            32,
            1,
            true
        );


    const labelMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x1769aa,
            roughness: 0.65
        });


    const label =
        new THREE.Mesh(
            labelGeometry,
            labelMaterial
        );

    label.position.y =
        -0.05;

    label.castShadow = true;

    group.add(label);


    /*
        Water
    */

    const waterGeometry =
        new THREE.CylinderGeometry(
            0.39,
            0.44,
            1.25,
            32
        );


    const waterMaterial =
        new THREE.MeshPhysicalMaterial({
            color: 0x4fa8ff,
            transparent: true,
            opacity: 0.65,
            roughness: 0.05,
            transmission: 0.15
        });


    const water =
        new THREE.Mesh(
            waterGeometry,
            waterMaterial
        );

    water.position.y =
        -0.22;

    water.castShadow = true;

    group.add(water);


    return group;
}


/* =========================================================
   BOTTLES
========================================================= */

const bottle1 =
    createBottle();

const bottle2 =
    createBottle();


const bottleHeight =
    1.6;


/*
    Player 1
*/

bottle1.position.set(
    -2.1,
    bottleHeight / 2 + 0.03,
    0
);


/*
    Player 2
*/

bottle2.position.set(
    2.1,
    bottleHeight / 2 + 0.03,
    0
);


scene.add(bottle1);
scene.add(bottle2);


/* =========================================================
   PHYSICS
========================================================= */

await RAPIER.init();


const world =
    new RAPIER.World({
        x: 0,
        y: -9.81,
        z: 0
    });


/* =========================================================
   TABLE PHYSICS
========================================================= */

const tableBodyDesc =
    RAPIER.RigidBodyDesc.fixed()
        .setTranslation(
            0,
            -tableHeight / 2,
            0
        );


const tableBody =
    world.createRigidBody(
        tableBodyDesc
    );


const tableCollider =
    RAPIER.ColliderDesc.cuboid(
        tableWidth / 2,
        tableHeight / 2,
        tableDepth / 2
    );


world.createCollider(
    tableCollider,
    tableBody
);


/* =========================================================
   BOTTLE PHYSICS
========================================================= */

function createBottlePhysics(
    position
) {

    const bodyDesc =
        RAPIER.RigidBodyDesc.dynamic()
            .setTranslation(
                position.x,
                position.y,
                position.z
            )
            .setCanSleep(true);


    const body =
        world.createRigidBody(
            bodyDesc
        );


    /*
        Capsule collider gives the
        bottle a simple physical shape.
    */

    const colliderDesc =
        RAPIER.ColliderDesc.capsule(
            0.78,
            0.43
        )
        .setDensity(0.8)
        .setFriction(0.65)
        .setRestitution(0.12);


    world.createCollider(
        colliderDesc,
        body
    );


    return body;
}


const physicsBottle1 =
    createBottlePhysics(
        bottle1.position
    );


const physicsBottle2 =
    createBottlePhysics(
        bottle2.position
    );


/* =========================================================
   PHYSICS HELPERS
========================================================= */

function syncBottle(
    visual,
    physics
) {

    const position =
        physics.translation();

    const rotation =
        physics.rotation();


    visual.position.set(
        position.x,
        position.y,
        position.z
    );


    visual.quaternion.set(
        rotation.x,
        rotation.y,
        rotation.z,
        rotation.w
    );
}


/* =========================================================
   GAME STATE
========================================================= */

let currentPlayer = 1;

let scores = {
    1: 0,
    2: 0
};

let flipping = false;

let swipeStart = null;

let activeBottle = null;

let activePhysics = null;

let lastBottleHeight = 0;

let landingTimer = null;


/* =========================================================
   TURN UI
========================================================= */

function updateTurn() {

    turnEl.textContent =
        `PLAYER ${currentPlayer}'S TURN`;

    messageEl.textContent =
        `Swipe up on Player ${currentPlayer}'s bottle`;
}


/* =========================================================
   SWIPE START
========================================================= */

function pointerDown(event) {

    if (flipping) return;

    /*
        Only allow interaction with
        the current player's bottle.
    */

    const rect =
        renderer.domElement.getBoundingClientRect();


    const x =
        event.clientX - rect.left;

    const y =
        event.clientY - rect.top;


    /*
        Simple screen-side detection.
    */

    const screenMiddle =
        window.innerWidth / 2;


    if (
        currentPlayer === 1 &&
        x > screenMiddle
    ) return;


    if (
        currentPlayer === 2 &&
        x < screenMiddle
    ) return;


    swipeStart = {
        x: event.clientX,
        y: event.clientY,
        time: performance.now()
    };


    powerEl.style.opacity = "1";

    powerBarEl.style.width = "0%";
}


/* =========================================================
   SWIPE MOVE
========================================================= */

function pointerMove(event) {

    if (!swipeStart) return;

    const distance =
        swipeStart.y - event.clientY;


    const power =
        Math.max(
            0,
            Math.min(
                distance / 250,
                1
            )
        );


    powerBarEl.style.width =
        `${power * 100}%`;
}


/* =========================================================
   SWIPE END
========================================================= */

function pointerUp(event) {

    if (!swipeStart) return;

    const endTime =
        performance.now();


    const dx =
        event.clientX -
        swipeStart.x;


    const dy =
        event.clientY -
        swipeStart.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const duration =
        Math.max(
            endTime -
            swipeStart.time,
            30
        );


    swipeStart = null;


    powerEl.style.opacity = "0";


    /*
        Ignore tiny movements.
    */

    if (
        distance < 35 ||
        dy > -25
    ) {

        return;
    }


    /*
        Swipe velocity.
    */

    const velocity =
        distance / duration;


    performFlip(
        dx,
        dy,
        velocity
    );
}


/* =========================================================
   PERFORM FLIP
========================================================= */

function performFlip(
    dx,
    dy,
    velocity
) {

    if (flipping) return;

    flipping = true;


    activeBottle =
        currentPlayer === 1
        ? bottle1
        : bottle2;


    activePhysics =
        currentPlayer === 1
        ? physicsBottle1
        : physicsBottle2;


    /*
        Reset physics state.
    */

    activePhysics.setBodyType(
        RAPIER.RigidBodyType.Dynamic,
        true
    );


    /*
        Reset velocity.
    */

    activePhysics.setLinvel(
        {
            x: 0,
            y: 0,
            z: 0
        },
        true
    );


    activePhysics.setAngvel(
        {
            x: 0,
            y: 0,
            z: 0
        },
        true
    );


    /*
        Stronger swipe =
        stronger upward force.
    */

    const swipeStrength =
        Math.min(
            Math.max(
                velocity * 2.5,
                0.8
            ),
            3.2
        );


    /*
        Forward movement.

        dx gives the sideways direction
        of the swipe.
    */

    const horizontalForce =
        Math.max(
            -1.2,
            Math.min(
                dx / 180,
                1.2
            )
        );


    /*
        Throw bottle upward.
    */

    activePhysics.setLinvel(
        {
            x: horizontalForce * 1.2,
            y: swipeStrength * 3.2,
            z: 0
        },
        true
    );


    /*
        Give the bottle spin.

        Faster swipe =
        more rotation.
    */

    const spin =
        swipeStrength * 7;


    activePhysics.setAngvel(
        {
            x: spin,
            y: horizontalForce * 2,
            z: 0
        },
        true
    );


    messageEl.textContent =
        "FLIPPING...";


    lastBottleHeight =
        activePhysics.translation().y;


    startLandingCheck();
}


/* =========================================================
   LANDING CHECK
========================================================= */

function startLandingCheck() {

    clearInterval(
        landingTimer
    );


    landingTimer =
        setInterval(() => {

            if (!activePhysics) return;


            const position =
                activePhysics.translation();


            const velocity =
                activePhysics.linvel();


            /*
                Wait until bottle is
                coming back down.
            */

            const falling =
                velocity.y < 0;


            /*
                Table is around y = 0.
                Bottle center is roughly
                0.8 above the table when standing.
            */

            const nearTable =
                position.y < 1.05;


            if (
                falling &&
                nearTable
            ) {

                clearInterval(
                    landingTimer
                );


                setTimeout(
                    evaluateLanding,
                    350
                );
            }

        }, 50);
}


/* =========================================================
   LANDING RESULT
========================================================= */

function evaluateLanding() {

    if (!activePhysics) return;


    const rotation =
        activePhysics.rotation();


    /*
        Convert quaternion into
        an up vector.
    */

    const up =
        new THREE.Vector3(
            0,
            1,
            0
        );


    up.applyQuaternion(
        new THREE.Quaternion(
            rotation.x,
            rotation.y,
            rotation.z,
            rotation.w
        )
    );


    /*
        If the bottle's up direction
        is close to the world's up
        direction, it landed upright.
    */

    const upright =
        up.y > 0.72;


    if (upright) {

        scores[currentPlayer]++;

        updateScores();


        messageEl.textContent =
            "PERFECT FLIP! 🔥";


        /*
            Give the bottle a tiny
            settling movement.
        */

        activePhysics.setLinvel(
            {
                x: 0,
                y: 0,
                z: 0
            },
            true
        );


        activePhysics.setAngvel(
            {
                x: 0,
                y: 0,
                z: 0
            },
            true
        );


        setTimeout(() => {

            flipping = false;

            messageEl.textContent =
                "Flip again!";

        }, 800);

    } else {

        messageEl.textContent =
            "MISSED!";


        setTimeout(() => {

            switchPlayer();

        }, 900);
    }
}


/* =========================================================
   SWITCH PLAYER
========================================================= */

function switchPlayer() {

    currentPlayer =
        currentPlayer === 1
        ? 2
        : 1;


    flipping = false;

    activeBottle = null;

    activePhysics = null;

    updateTurn();
}


/* =========================================================
   SCORE
========================================================= */

function updateScores() {

    score1El.textContent =
        scores[1];

    score2El.textContent =
        scores[2];
}


/* =========================================================
   POINTER EVENTS
========================================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    pointerDown
);

renderer.domElement.addEventListener(
    "pointermove",
    pointerMove
);

renderer.domElement.addEventListener(
    "pointerup",
    pointerUp
);

renderer.domElement.addEventListener(
    "pointercancel",
    () => {
        swipeStart = null;
        powerEl.style.opacity = "0";
    }
);


/* =========================================================
   RESTART
========================================================= */

restartBtn.addEventListener(
    "click",
    () => {

        scores = {
            1: 0,
            2: 0
        };


        currentPlayer = 1;

        flipping = false;


        resetBottle(
            physicsBottle1,
            bottle1,
            -2.1
        );


        resetBottle(
            physicsBottle2,
            bottle2,
            2.1
        );


        updateScores();

        updateTurn();

        restartBtn.style.display =
            "none";
    }
);


function resetBottle(
    physics,
    visual,
    x
) {

    physics.setTranslation(
        {
            x: x,
            y: bottleHeight / 2 + 0.03,
            z: 0
        },
        true
    );


    physics.setRotation(
        {
            x: 0,
            y: 0,
            z: 0,
            w: 1
        },
        true
    );


    physics.setLinvel(
        {
            x: 0,
            y: 0,
            z: 0
        },
        true
    );


    physics.setAngvel(
        {
            x: 0,
            y: 0,
            z: 0
        },
        true
    );


    visual.position.set(
        x,
        bottleHeight / 2 + 0.03,
        0
    );


    visual.rotation.set(
        0,
        0,
        0
    );
}


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );
    }
);


/* =========================================================
   ANIMATION LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.033
        );


    /*
        Advance physics.
    */

    world.timestep =
        delta;

    world.step();


    /*
        Sync physics → 3D models.
    */

    syncBottle(
        bottle1,
        physicsBottle1
    );

    syncBottle(
        bottle2,
        physicsBottle2
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );
}


updateTurn();

animate();

</script>

</body>
</html>
