<html lang="en">

<!-- THREE.JS -->

<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

<script type="module">

import * as THREE from "three";

import {
    OrbitControls
} from "three/addons/controls/OrbitControls.js";

import RAPIER from
    "https://cdn.jsdelivr.net/npm/@dimforge/rapier3d-compat@0.19.3/+esm";


/* =========================================================
   BASIC SETUP
========================================================= */

const game = document.getElementById("game");

const score1El = document.getElementById("score1");
const score2El = document.getElementById("score2");

const turnEl = document.getElementById("turn");
const messageEl = document.getElementById("message");

const powerEl = document.getElementById("power");
const powerBarEl = document.getElementById("powerBar");

const restartBtn = document.getElementById("restart");
const cameraBtn = document.getElementById("cameraBtn");


/* =========================================================
   THREE.JS
========================================================= */

const raycaster =
    new THREE.Raycaster();

const pointer =
    new THREE.Vector2();

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x171717);

scene.fog = new THREE.Fog(
    0x171717,
    7,
    18
);


const camera = new THREE.PerspectiveCamera(
    45,
    window.innerWidth / window.innerHeight,
    0.1,
    100
);

camera.position.set(
    0,
    5.4,
    8.5
);

function updateCameraForScreen() {

    const aspect =
        window.innerWidth /
        window.innerHeight;


    if (aspect < 1) {

    /*
        Portrait phone
    */

    camera.fov = 70;

    camera.position.set(
        0,
        5.8,
        10
    );

} else {

    /*
        Landscape / PC
    */

    camera.fov = 45;

    camera.position.set(
        0,
        5.4,
        8.5
    );
}


    camera.aspect =
        aspect;

    camera.updateProjectionMatrix();
}

updateCameraForScreen();


const renderer = new THREE.WebGLRenderer({
    antialias: true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.outputColorSpace =
    THREE.SRGBColorSpace;

game.appendChild(renderer.domElement);


/* =========================================================
   CAMERA CONTROLS
========================================================= */

const controls = new OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.enablePan = false;

controls.enabled = false;

controls.minDistance = 6;

controls.maxDistance = 12;

controls.minPolarAngle = 0.65;

controls.maxPolarAngle = 1.35;

cameraBtn.addEventListener(
    "click",
    () => {

        cameraMode =
            !cameraMode;

        controls.enabled =
            cameraMode;

        cameraBtn.textContent =
            cameraMode
                ? "✕"
                : "👁";
    }
);

/* =========================================================
   LIGHTING
========================================================= */

const ambientLight =
    new THREE.HemisphereLight(
        0xffffff,
        0x333333,
        2
    );

scene.add(ambientLight);


const keyLight =
    new THREE.DirectionalLight(
        0xffffff,
        3
    );

keyLight.position.set(
    4,
    8,
    5
);

keyLight.castShadow = true;

keyLight.shadow.mapSize.width = 2048;
keyLight.shadow.mapSize.height = 2048;

keyLight.shadow.camera.left = -8;
keyLight.shadow.camera.right = 8;
keyLight.shadow.camera.top = 8;
keyLight.shadow.camera.bottom = -8;

scene.add(keyLight);


/* =========================================================
   TABLE
========================================================= */

const tableWidth = 7.5;
const tableDepth = 4.5;
const tableHeight = 0.5;


const tableGeometry =
    new THREE.BoxGeometry(
        tableWidth,
        tableHeight,
        tableDepth
    );


const tableMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x70451f,
        roughness: 0.55,
        metalness: 0.05
    });


const table =
    new THREE.Mesh(
        tableGeometry,
        tableMaterial
    );

table.position.y =
    -tableHeight / 2;

table.receiveShadow = true;

table.castShadow = true;

scene.add(table);


/* =========================================================
   TABLE TOP LINE
========================================================= */

const centerLineGeometry =
    new THREE.BoxGeometry(
        0.025,
        0.012,
        tableDepth - 0.3
    );

const centerLineMaterial =
    new THREE.MeshBasicMaterial({
        color: 0xffffff,
        transparent: true,
        opacity: 0.18
    });

const centerLine =
    new THREE.Mesh(
        centerLineGeometry,
        centerLineMaterial
    );

centerLine.position.y =
    0.256;

scene.add(centerLine);

const BOTTLE_STYLES = {

    blue: {
        label: 0x1769aa,
        water: 0x4fa8ff
    },

    red: {
        label: 0xff3b30,
        water: 0xff6b6b
    }

};


/* =========================================================
   BOTTLE CREATION
========================================================= */

function createBottle(style) {

    const group =
        new THREE.Group();


    /*
        Main bottle body
    */

    const bodyGeometry =
        new THREE.CylinderGeometry(
            0.42,
            0.47,
            1.75,
            32
        );


    const bodyMaterial =
        new THREE.MeshPhysicalMaterial({
            color: 0xf2f7fa,
            transparent: true,
            opacity: 0.68,
            roughness: 0.12,
            metalness: 0,
            transmission: 0.25,
            thickness: 0.2
        });


    const body =
        new THREE.Mesh(
            bodyGeometry,
            bodyMaterial
        );

    body.castShadow = true;
    body.receiveShadow = true;

    group.add(body);


    /*
        Shoulder
    */

    const shoulderGeometry =
        new THREE.SphereGeometry(
            0.43,
            32,
            16,
            0,
            Math.PI * 2,
            0,
            Math.PI / 2
        );


    const shoulder =
        new THREE.Mesh(
            shoulderGeometry,
            bodyMaterial
        );

    shoulder.scale.y = 0.65;

    shoulder.position.y =
        0.85;

    shoulder.castShadow = true;

    group.add(shoulder);


    /*
        Neck
    */

    const neckGeometry =
        new THREE.CylinderGeometry(
            0.19,
            0.22,
            0.45,
            24
        );


    const neck =
        new THREE.Mesh(
            neckGeometry,
            bodyMaterial
        );

    neck.position.y =
        1.15;

    neck.castShadow = true;

    group.add(neck);


    /*
        Cap
    */

    const capGeometry =
        new THREE.CylinderGeometry(
            0.21,
            0.21,
            0.18,
            24
        );


    const capMaterial =
        new THREE.MeshStandardMaterial({
            color: 0xeeeeee,
            roughness: 0.45
        });


    const cap =
        new THREE.Mesh(
            capGeometry,
            capMaterial
        );

    cap.position.y =
        1.47;

    cap.castShadow = true;

    group.add(cap);


    /*
        Bottle label
    */

    const labelGeometry =
        new THREE.CylinderGeometry(
            0.425,
            0.425,
            0.48,
            32,
            1,
            true
        );


    const labelMaterial =
        new THREE.MeshStandardMaterial({
            color: style.label,
            roughness: 0.65
        });


    const label =
        new THREE.Mesh(
            labelGeometry,
            labelMaterial
        );

    label.position.y =
        -0.05;

    label.castShadow = true;

    group.add(label);


    /*
        Water
    */

    const waterGeometry =
        new THREE.CylinderGeometry(
            0.39,
            0.44,
            1.25,
            32
        );


    const waterMaterial =
        new THREE.MeshPhysicalMaterial({
            color: style.water,
            transparent: true,
            opacity: 0.65,
            roughness: 0.2,
            transmission: 0.15
        });


    const water =
        new THREE.Mesh(
            waterGeometry,
            waterMaterial
        );

    water.position.y =
        -0.22;

    water.castShadow = true;

    group.add(water);


    return group;
}


/* =========================================================
   BOTTLES
========================================================= */

const bottle1 =
    createBottle(
        BOTTLE_STYLES.blue
    );

const bottle2 =
    createBottle(
        BOTTLE_STYLES.red
    );


const bottleHeight =
    1.6;


/*
    Player 1
*/

bottle1.position.set(
    -2.1,
    bottleHeight / 2 + 0.03,
    0
);


/*
    Player 2
*/

bottle2.position.set(
    2.1,
    bottleHeight / 2 + 0.03,
    0
);


scene.add(bottle1);
scene.add(bottle2);


/* =========================================================
   PHYSICS
========================================================= */

await RAPIER.init();


const world =
    new RAPIER.World({
        x: 0,
        y: -9.81,
        z: 0
    });


/* =========================================================
   TABLE PHYSICS
========================================================= */

const tableBodyDesc =
    RAPIER.RigidBodyDesc.fixed()
        .setTranslation(
            0,
            -tableHeight / 2,
            0
        );


const tableBody =
    world.createRigidBody(
        tableBodyDesc
    );


const tableCollider =
    RAPIER.ColliderDesc.cuboid(
        tableWidth / 2,
        tableHeight / 2,
        tableDepth / 2
    );


world.createCollider(
    tableCollider,
    tableBody
);


/* =========================================================
   BOTTLE PHYSICS
========================================================= */

function createBottlePhysics(
    position
) {

    const bodyDesc =
        RAPIER.RigidBodyDesc.dynamic()
            .setTranslation(
                position.x,
                position.y,
                position.z
            )
            .setCanSleep(true);

    const body =
        world.createRigidBody(
            bodyDesc
        );

    /*
        Main bottle body.

        Using a cuboid gives the physics body
        a flat bottom so the bottle can settle
        upright instead of balancing on a
        rounded capsule.
    */

    const colliderDesc =
        RAPIER.ColliderDesc.cuboid(
            0.43,
            0.78,
            0.43
        )
        .setDensity(0.65)
        .setFriction(0.65)
        .setRestitution(0.12);

    world.createCollider(
        colliderDesc,
        body
    );

    /*
        Heavy bottom / water mass.

        This keeps extra weight concentrated
        near the bottom of the bottle.
    */

    const bottomCollider =
        RAPIER.ColliderDesc.cuboid(
            0.38,
            0.15,
            0.38
        )
        .setTranslation(
            0,
            -0.51,
            0
        )
        .setDensity(25.9)
        .setFriction(0.65)
        .setRestitution(0.10);

    world.createCollider(
        bottomCollider,
        body
    );

    return body;
}


const physicsBottle1 =
    createBottlePhysics(
        bottle1.position
    );


const physicsBottle2 =
    createBottlePhysics(
        bottle2.position
    );


/* =========================================================
   PHYSICS HELPERS
========================================================= */

function syncBottle(
    visual,
    physics
) {

    const position =
        physics.translation();

    const rotation =
        physics.rotation();


    visual.position.set(
        position.x,
        position.y,
        position.z
    );


    visual.quaternion.set(
        rotation.x,
        rotation.y,
        rotation.z,
        rotation.w
    );
}


/* =========================================================
   GAME STATE
========================================================= */

let currentPlayer = 1;

let computerThinking = false;

let scores = {
    1: 0,
    2: 0
};

let flipping = false;

let swipeStart = null;

let activeBottle = null;

let activePhysics = null;

let lastBottleHeight = 0;

let landingTimer = null;

let cameraMode = false;

let rotationAmount = 0;
let lastRotationTime = 0;


/* =========================================================
   TURN UI
========================================================= */

function updateTurn() {

    turnEl.textContent =
        `PLAYER ${currentPlayer}'S TURN`;

    messageEl.textContent =
        `Swipe up on Player ${currentPlayer}'s bottle`;
}


/* =========================================================
   SWIPE START
========================================================= */

function pointerDown(event) {

    if (cameraMode) return;

    if (flipping) return;


    const rect =
        renderer.domElement.getBoundingClientRect();


    pointer.x =
        (
            (event.clientX - rect.left)
            / rect.width
        ) * 2 - 1;

    pointer.y =
        -(
            (event.clientY - rect.top)
            / rect.height
        ) * 2 + 1;


    raycaster.setFromCamera(
        pointer,
        camera
    );


    /*
        Check Player 1 bottle.
    */

    const hitsBottle1 =
        raycaster.intersectObject(
            bottle1,
            true
        );


    /*
        Check Player 2 bottle.
    */

    const hitsBottle2 =
        raycaster.intersectObject(
            bottle2,
            true
        );


    /*
        Decide which bottle was touched.
    */

    let touchedBottle = null;


    if (hitsBottle1.length > 0) {

        touchedBottle =
            bottle1;

    } else if (
        hitsBottle2.length > 0
    ) {

        touchedBottle =
            bottle2;

    }


    /*
        Nothing was touched.
    */

    if (!touchedBottle) {
        return;
    }


    /*
        Only the current player's
        bottle can be controlled.
    */

    if (
        currentPlayer === 1 &&
        touchedBottle !== bottle1
    ) {
        return;
    }


    if (
        currentPlayer === 2 &&
        touchedBottle !== bottle2
    ) {
        return;
    }


    /*
        Start the swipe.
    */

    swipeStart = {
        x: event.clientX,
        y: event.clientY,
        time: performance.now()
    };


    powerEl.style.opacity =
        "1";

    powerBarEl.style.width =
        "0%";
}


/* =========================================================
   SWIPE MOVE
========================================================= */

function pointerMove(event) {
    
    if (cameraMode) return;

    if (!swipeStart) return;

    const distance =
        swipeStart.y - event.clientY;


    const power =
        Math.max(
            0,
            Math.min(
                distance / 250,
                1
            )
        );


    powerBarEl.style.width =
        `${power * 100}%`;
}


/* =========================================================
   SWIPE END
========================================================= */

function pointerUp(event) {

    if (cameraMode) return;

    if (!swipeStart) return;

    const endTime =
        performance.now();


    const dx =
        event.clientX -
        swipeStart.x;


    const dy =
        event.clientY -
        swipeStart.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    const duration =
        Math.max(
            endTime -
            swipeStart.time,
            30
        );


    swipeStart = null;


    powerEl.style.opacity = "0";


    /*
        Ignore tiny movements.
    */

    if (
        distance < 35 ||
        dy > -25
    ) {

        return;
    }


    /*
        Swipe velocity.
    */

    const velocity =
        distance / duration;


    performFlip(
        dx,
        dy,
        velocity
    );
}

function computerFlip() {

    if (
        currentPlayer !== 2 ||
        !computerThinking ||
        flipping
    ) {
        return;
    }

    computerThinking = false;

    flipping = true;

    activeBottle =
        bottle2;

    activePhysics =
        physicsBottle2;


    /*
        Give the computer a random
        but controlled flip.
    */

    const swipeStrength =
    3.2 +
    Math.random() * 0.35;

const horizontalForce =
    -0.2 +
    Math.random() * 0.4;


    activePhysics.setLinvel(
        {
            x: horizontalForce * 1.2,
            y: swipeStrength * 2.4,
            z: 0
        },
        true
    );


    /*
        Give the computer bottle spin.
    */

    const spin =
        swipeStrength * 1.3;

    activePhysics.setAngvel(
        {
            x: spin,
            y: horizontalForce * 2,
            z: 0
        },
        true
    );


    /*
        Start tracking the flip exactly
        like the human player's flip.
    */

    rotationAmount = 0;

    lastRotationTime =
        performance.now();


    startLandingCheck();
}


/* =========================================================
   PERFORM FLIP
========================================================= */

function performFlip(
    dx,
    dy,
    velocity
) {
    if (currentPlayer === 2) {
    return;
}

    if (flipping) return;

    flipping = true;


    activeBottle =
        currentPlayer === 1
        ? bottle1
        : bottle2;


    activePhysics =
        currentPlayer === 1
        ? physicsBottle1
        : physicsBottle2;


    /*
        Reset physics state.
    */

    activePhysics.setBodyType(
        RAPIER.RigidBodyType.Dynamic,
        true
    );


    /*
        Reset velocity.
    */

    activePhysics.setLinvel(
        {
            x: 0,
            y: 0,
            z: 0
        },
        true
    );


    activePhysics.setAngvel(
        {
            x: 0,
            y: 0,
            z: 0
        },
        true
    );


    /*
        Stronger swipe =
        stronger upward force.
    */

    const swipeStrength =
        Math.min(
            Math.max(
                velocity * 2.6,
                0.8
            ),
            3.2
        );


    /*
        Forward movement.

        dx gives the sideways direction
        of the swipe.
    */

    const horizontalForce =
        Math.max(
            -1.2,
            Math.min(
                dx / 180,
                1.2
            )
        );


    /*
        Throw bottle upward.
    */

    activePhysics.setLinvel(
        {
            x: horizontalForce * 1.0,
            y: swipeStrength * 2.3,
            z: 0
        },
        true
    );

    rotationAmount = 0;
lastRotationTime = performance.now();


    /*
        Give the bottle spin.

        Faster swipe =
        more rotation
    */

    const spin =
        swipeStrength * 1.5


    activePhysics.setAngvel(
        {
            x: spin,
            y: horizontalForce * 2,
            z: 0
        },
        true
    );


    messageEl.textContent =
        "FLIPPING...";


    lastBottleHeight =
        activePhysics.translation().y;


    startLandingCheck();
}


/* =========================================================
   LANDING CHECK
========================================================= */

function startLandingCheck() {

    clearInterval(
        landingTimer
    );

    const landingStart =
        performance.now();

    let settledTime = 0;

    landingTimer =
        setInterval(() => {

            if (!activePhysics) return;

            const position =
                activePhysics.translation();

            const velocity =
                activePhysics.linvel();

            const angularVelocity =
                activePhysics.angvel();

            const currentTime =
                performance.now();

            const deltaTime =
                (currentTime - lastRotationTime) / 1000;

            rotationAmount +=
                Math.abs(
                    angularVelocity.x
                ) * deltaTime;

            lastRotationTime =
                currentTime;

            const falling =
                velocity.y < 0;

            const nearTable =
                position.y < 1.05;

            /*
                Start checking for a settled landing
                once the bottle reaches the table.
            */

            if (falling && nearTable) {

                const speed =
                    Math.sqrt(
                        velocity.x ** 2 +
                        velocity.y ** 2 +
                        velocity.z ** 2
                    );

                const spin =
                    Math.sqrt(
                        angularVelocity.x ** 2 +
                        angularVelocity.y ** 2 +
                        angularVelocity.z ** 2
                    );

                const settled =
                    speed < 0.15 &&
                    spin < 0.15;

                if (settled) {

                    settledTime += 50;

                    /*
                        Bottle must stay almost completely
                        still for 200ms before we judge it.
                    */

                    if (settledTime >= 200) {

                        clearInterval(
                            landingTimer
                        );

                        evaluateLanding();

                    }

                } else {

                    settledTime = 0;

                }

            }

            /*
                Safety fallback.

                If the bottle keeps moving for too long,
                judge it anyway after 2.5 seconds.
            */

            if (
                currentTime -
                landingStart >= 2500
            ) {

                clearInterval(
                    landingTimer
                );

                evaluateLanding();

            }

        }, 50);
}


/* =========================================================
   LANDING RESULT
========================================================= */

function evaluateLanding() {


    if (!activePhysics) return;

    const rotation =
        activePhysics.rotation();

    /*
        Convert quaternion into
        an up vector.
    */

    const up =
        new THREE.Vector3(
            0,
            1,
            0
        );

    up.applyQuaternion(
        new THREE.Quaternion(
            rotation.x,
            rotation.y,
            rotation.z,
            rotation.w
        )
    );

    /*
        Check if the bottle landed upright.
    */

    const upright =
        up.y > 0.58;

    const completedFlip =
        rotationAmount >= Math.PI * 1.5;


    if (
        upright &&
        completedFlip
    ) {

        scores[currentPlayer]++;

        updateScores();

        messageEl.textContent =
            "PERFECT FLIP! 🔥";


        /*
            Stop the bottle's movement.
        */

        activePhysics.setLinvel(
            {
                x: 0,
                y: 0,
                z: 0
            },
            true
        );

        activePhysics.setAngvel(
            {
                x: 0,
                y: 0,
                z: 0
            },
            true
        );


        /*
            Reset the bottle after
            showing the successful landing.
        */

        setTimeout(() => {

            const x =
                currentPlayer === 1
                    ? -2.1
                    : 2.1;

            resetBottle(
                activePhysics,
                activeBottle,

            );

*/

        /*
            Reset the bottle before

        */

        setTimeout(() => {

            const x =
                currentPlayer === 1
                    ? -2.1
                    : 2.1;

            resetBottle(
                activePhysics,
                activeBottle,
                x
            );

}


/* =========================================================
   SWITCH PLAYER
========================================================= */


function switchPlayer() {

    currentPlayer =
        currentPlayer === 1
        ? 2
        : 1;

    flipping = false;

    activeBottle = null;
    activePhysics = null;

    // Reset both bottles upright
    resetBottle(
        physicsBottle1,
        bottle1,
        -2.1
    );

    resetBottle(
        physicsBottle2,
        bottle2,
        2.1
    );

    updateTurn();


    /*
        If it is the computer's turn,
        let the computer flip automatically.
    */

    if (
        currentPlayer === 2
    ) {

        computerThinking = true;

        setTimeout(() => {

            computerFlip();

        }, 1000);

    }
}



/* =========================================================
   SCORE
========================================================= */

function updateScores() {

    score1El.textContent =
        scores[1];

    score2El.textContent =
        scores[2];
}


/* =========================================================
   POINTER EVENTS
========================================================= */

renderer.domElement.addEventListener(
    "pointerdown",
    pointerDown
);

renderer.domElement.addEventListener(
    "pointermove",
    pointerMove
);

renderer.domElement.addEventListener(
    "pointerup",
    pointerUp
);

renderer.domElement.addEventListener(
    "pointercancel",
    () => {
        swipeStart = null;
        powerEl.style.opacity = "0";
    }
);


/* =========================================================
   RESTART
========================================================= */

restartBtn.addEventListener(
    "click",
    () => {

        scores = {
            1: 0,
            2: 0
        };


        currentPlayer = 1;

        flipping = false;


        resetBottle(
            physicsBottle1,
            bottle1,
            -2.1
        );


        resetBottle(
            physicsBottle2,
            bottle2,
            2.1
        );


        updateScores();

        updateTurn();

        restartBtn.style.display =
            "non";
    }
);


function resetBottle(
    physics,
    visual,
    x
) {

    physics.setTranslation(
        {
            x: x,
            y: bottleHeight / 2 + 0.03,
            z: 0
        },
        true
    );


    physics.setRotation(
        {
            x: 0,
            y: 0,
            z: 0,
            w: 1
        },
        true
    );


    physics.setLinvel(
        {
            x: 0,
            y: 0,
            z: 0
        },
        true
    );


    physics.setAngvel(
        {
            x: 0,
            y: 0,
            z: 0
        },
        true
    );


    visual.position.set(
        x,
        bottleHeight / 2 + 0.03,
        0
    );


    visual.rotation.set(
        0,
        0,
        0
    );
}


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        updateCameraForScreen();
    }
);


/* =========================================================
   ANIMATION LOOP
========================================================= */

const clock =
    new THREE.Clock();


function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            clock.getDelta(),
            0.033
        );


    /*
        Advance physics.
    */

    world.timestep =
        delta;

    world.step();


    /*
        Sync physics → 3D models.
    */

    syncBottle(
        bottle1,
        physicsBottle1
    );

    syncBottle(
        bottle2,
        physicsBottle2
    );


    controls.update();


    renderer.render(
        scene,
        camera
    );
}


updateTurn();

animate();

</script>
